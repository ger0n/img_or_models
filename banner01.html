<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест баннера в VS Code</title>
  <!-- Подключаем SweetAlert2 из интернета -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    body {
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f3f4f6;
    }
    .test-trigger-btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background-color: #16a34a;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

 <template id="promo-banner-template">
  <style>
    /* 1. Убираем лишние внутренние поля самого модального окна SweetAlert */
.swal2-popup {
  padding: 16px 0 20px !important;
  border-radius: 20px !important;
}

/* 2. Задаём единый тонкий отступ слева и справа для всего содержимого (регулируйте 12px) */
.swal2-html-container {
  margin: 0 !important;
  padding: 0 12px !important;
  overflow: visible !important;
}
.swal2-container {
  padding: 8px !important;
}
/* Карточка слайдера остаётся ровно по ширине полей формы */
.pm-story-card {
  position: relative;
  width: 100%;
  height: 210px;
  border-radius: 14px;
  overflow: hidden;
  background-color: #f3f4f6;
  border: none;
  cursor: pointer;
  touch-action: pan-y;
}
    .pm-root {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      color: #111827;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Прячем крестик по умолчанию (для Экрана 1 и Экрана 5) и убираем квадратную рамку */
.swal2-close {
  display: none !important;
  box-shadow: none !important;
  outline: none !important;
  border: none !important;
  background: transparent !important;
}

.swal2-close:focus,
.swal2-close:hover {
  box-shadow: none !important;
  outline: none !important;
  background: transparent !important;
}

/* Показываем крестик только когда открыт баннер (Экран 2–4) */
.swal2-popup.pm-show-close .swal2-close {
  display: flex !important;
}

    /* ================= ЭКРАН 1: КРУПНАЯ ГАЛОЧКА ПО ЦЕНТРУ ================= */
    .pm-hero-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 12px 20px;
      /* СКОРОСТЬ ПОДЪЁМА ГАЛОЧКИ ВВЕРХ (меняйте 0.6s на 0.4s или 0.8s) */
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pm-circle {
      /* РАЗМЕР КРУГА НА ЭКРАНЕ 1 И ЭКРАНЕ 5 (сейчас крупный 84x84 px) */
      width: 84px;
      height: 84px;
      border-radius: 50%;
      border: 4px solid #059639; /* Толщина и цвет зелёной рамки */
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 22px rgba(5, 150, 57, 0.14);
      animation: pmPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pm-check {
      /* РАЗМЕР САМОЙ ГАЛОЧКИ ВНУТРИ КРУГА */
      width: 42px;
      height: 42px;
      stroke: #059639;
      stroke-width: 3.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: pmDraw 0.5s 0.15s ease forwards;
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pm-hero-title {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 800;
      color: #059639;
      text-align: center;
    }

    .pm-hero-sub {
      margin: 0;
      font-size: 15px;
      color: #374151;
      text-align: center;
    }

    /* ================= ЭКРАН 2: КОМПАКТНАЯ КАПСУЛА СВЕРХУ ================= */
    .pm-root.is-expanded .pm-hero-status {
      flex-direction: row;
      background-color: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 9999px;
      padding: 8px 16px;
      /* ОТСТУП СВЕРХУ 16px, ЧТОБЫ КРЕСТИК ЗАКРЫТИЯ НЕ НАЕЗЖАЛ НА КАПСУЛУ */
      margin: 16px 0 12px;
      gap: 10px;
    }

    .pm-root.is-expanded .pm-circle {
      /* Размер маленького круга в капсуле наверху */
      width: 24px;
      height: 24px;
      border-width: 2px;
      margin-bottom: 0;
      box-shadow: none;
    }

    .pm-root.is-expanded .pm-check {
      width: 14px;
      height: 14px;
      stroke-width: 3;
    }

    .pm-root.is-expanded .pm-hero-title {
      display: none;
    }

    .pm-root.is-expanded .pm-hero-sub {
      font-size: 13.5px;
      font-weight: 600;
      color: #065f46;
    }
    /* ================= ПЛАВНОЕ РАСКРЫТИЕ БАННЕРА СНИЗУ ================= */
    .pm-body {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(14px);
      /* СКОРОСТЬ РАСКРЫТИЯ НИЖНЕГО БЛОКА (меняйте 0.65s при желании) */
      transition: max-height 0.65s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.5s ease 0.1s,
                  transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pm-root.is-expanded .pm-body {
      max-height: 1200px;
      opacity: 1;
      transform: translateY(0);
    }

    /* ================= БЕЙДЖ С НАХЛЁСТОМ (БЕЗ БЕЛОЙ РАМКИ) ================= */
    .pm-badge-wrap {
      /* ЖЁСТКАЯ ВЫСОТА 26px — чтобы при скрытии бейджа картинка НЕ подпрыгивала */
      height: 26px;
      text-align: left;
      padding-left: 14px;
      margin-bottom: -12px; /* Нахлёст на верхний край картинки */
      position: relative;
      z-index: 3;
    }

    .pm-badge {
      display: inline-block;
      background-color: #ffe4e6; /* Мягкий розовый фон как на макете */
      color: #be123c;            /* Бордовый текст */
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 9999px;
      border: none;              /* Без белой обводки */
    }

    .pm-badge.is-hidden {
      visibility: hidden; /* Прячем, но сохраняем место в верстке */
      opacity: 0;
    }

    /* ================= КАРТОЧКА STORIES (ФОТО / ВИДЕО) ================= */
    .pm-story-card {
      position: relative;
      width: 100%;
      /* ВЫСОТА КАРТИНКИ СЛАЙДЕРА (регулируйте от 180px до 240px) */
      height: 210px;
      border-radius: 16px;
      overflow: hidden;
      background-color: #f3f4f6; /* Светлый фон вместо чёрного квадрата */
      cursor: pointer;
      touch-action: pan-y;
    }

    .pm-story-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ЗЕЛЁНЫЕ ПОЛОСКИ ПРОГРЕССА ПОД КАРТИНКОЙ */
    .pm-progress-bars {
      display: flex;
      gap: 6px;
      margin: 10px 0 12px;
    }

    .pm-bar-track {
      flex: 1;
      height: 4px; /* Толщина полосок прогресса */
      background-color: #e5e7eb;
      border-radius: 9999px;
      overflow: hidden;
    }

    .pm-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #059639;
      border-radius: 9999px;
    }

    /* ================= ТЕКСТЫ СЛАЙДА (ЖЁСТКО 2 СТРОКИ — НОЛЬ ПРЫЖКОВ) ================= */
    .pm-slide-info {
      text-align: left;
      margin-bottom: 10px;
    }

    .pm-slide-title {
      margin: 0 0 4px;
      font-size: 17.5px;
      font-weight: 700;
      color: #111827;
      line-height: 23px;
      /* ВЫСОТА РОВНО ПОД 2 СТРОКИ (23px * 2 = 46px) */
      height: 46px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .pm-slide-desc {
      margin: 0;
      font-size: 14px;
      color: #4b5563;
      line-height: 21px;
      /* ВЫСОТА РОВНО ПОД 2 СТРОКИ (21px * 2 = 42px) */
      height: 42px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Постоянный слоган по центру */
    .pm-static-slogan {
      margin: 10px 0 14px;
      padding-top: 10px;
      border-top: 1px solid #f3f4f6;
      text-align: center;
      font-size: 13.5px;
      font-weight: 500;
      color: #059639;
    }

    /* ================= КРУПНЫЕ ПОЛЯ ФОРМЫ ДЛЯ СМАРТФОНА ================= */
    .pm-form {
      text-align: left;
    }

    .pm-label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 5px;
    }

    .pm-field-box {
      position: relative;
      margin-bottom: 12px;
    }

    .pm-input {
      width: 100%;
      /* ВЫСОТА ПОЛЕЙ ВВОДА (удобно нажимать пальцем) */
      height: 48px;
      padding: 0 38px 0 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      color: #111827;
      background-color: #ffffff;
      box-sizing: border-box;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .pm-input:focus {
      border-color: #059639;
      box-shadow: 0 0 0 3px rgba(5, 150, 57, 0.12);
    }

    .pm-chevron {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      pointer-events: none;
      display: flex;
    }

    .pm-submit-btn {
      width: 100%;
      /* ВЫСОТА КНОПКИ ПОДТВЕРЖДЕНИЯ */
      height: 50px;
      margin-top: 4px;
      background-color: #e5e7eb;
      color: #9ca3af;
      border: none;
      border-radius: 9999px;
      font-size: 15.5px;
      font-weight: 600;
      cursor: not-allowed;
      transition: all 0.2s ease;
    }

    .pm-submit-btn.is-active {
      background-color: #059639;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(5, 150, 57, 0.24);
    }

    /* ================= ЭКРАН 5: ФИНАЛ С ЗЕЛЁНОЙ КНОПКОЙ OK ================= */
    /* Точные отступы как у .pm-hero-status на Экране 1 */
.pm-final-screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 12px 20px;
  text-align: center;
}

    /* Компактная кнопка "OK" как на макете Экрана 5 */
.pm-final-ok-btn {
  margin-top: 22px;
  min-width: 96px;
  height: 42px;
  padding: 0 26px;
  background-color: #059639;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

    @keyframes pmPop {
      0% { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes pmDraw {
      to { stroke-dashoffset: 0; }
    }
  </style>
  <div id="pm-root" class="pm-root">
    <!-- Шапка: Экран 1 -> Экран 2 -->
    <div class="pm-hero-status">
      <div class="pm-circle">
        <svg class="pm-check" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 id="pm-hero-title" class="pm-hero-title"></h2>
      <p id="pm-hero-sub" class="pm-hero-sub"></p>
    </div>

    <!-- Основной контейнер баннера -->
    <div id="pm-body" class="pm-body">
      <div class="pm-badge-wrap">
        <span id="pm-badge" class="pm-badge is-hidden"></span>
      </div>

      <div id="pm-story-card" class="pm-story-card"></div>
      <div id="pm-progress-bars" class="pm-progress-bars"></div>

      <div class="pm-slide-info">
        <h3 id="pm-slide-title" class="pm-slide-title"></h3>
        <p id="pm-slide-desc" class="pm-slide-desc"></p>
      </div>

      <div id="pm-static-slogan" class="pm-static-slogan"></div>

      <div id="pm-form-wrap" class="pm-form">
        <label id="pm-lbl-offer" class="pm-label" for="pm-select-offer"></label>
        <div class="pm-field-box">
          <select id="pm-select-offer" class="pm-input"></select>
          <span class="pm-chevron">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </div>

        <label id="pm-lbl-date" class="pm-label" for="pm-input-date"></label>
        <div class="pm-field-box">
          <input type="date" id="pm-input-date" class="pm-input">
        </div>

        <label id="pm-lbl-time" class="pm-label" for="pm-select-time"></label>
        <div class="pm-field-box">
          <select id="pm-select-time" class="pm-input">
            <option id="pm-opt-time-def" value=""></option>
            <option value="10:00">10:00</option>
            <option value="11:30">11:30</option>
            <option value="14:00">14:00</option>
            <option value="16:30">16:30</option>
          </select>
          <span class="pm-chevron">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </span>
        </div>

        <button type="button" id="pm-submit-btn" class="pm-submit-btn" disabled></button>
      </div>
    </div>

    <!-- Экран 5: Финал после подтверждения -->
    <div id="pm-final-screen" class="pm-final-screen">
      <div class="pm-circle">
        <svg class="pm-check" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2 id="pm-final-title" class="pm-hero-title"></h2>
      <p id="pm-final-sub" class="pm-hero-sub"></p>
      <button type="button" id="pm-final-ok-btn" class="pm-final-ok-btn">OK</button>
    </div>
  </div>
</template>

  <script>
    // Тестовые данные (имитация ответа из вашей таблицы Promotions на языке az)
    const mockPromotions = [
      {
        id: "promo_2",
        type: "Событие",
        badge: "", // Пустой бейдж — красная плашка скроется автоматически
        title: "29 Noyabr Cərrah-ortoped qəbulu",
        description: "Dəvət olunmuş mütəxəssisin öncədən qeydiyyatla müayinəsi.",
        serviceName: "Cərrah-ortoped qəbulu",
        fixedDate: "2026-11-29",
        durationSec: 5,
        mediaUrl: "https://raw.githubusercontent.com/ger0n/img_or_models/refs/heads/main/poster_blood02.png",
        mediaType: "image"
      },
      {
        id: "promo_3",
        type: "Событие",
        badge: "",
        title: "20 Dekabr Aparıcı cərrahın qəbulu",
        description: "Klinikamızda cərrah konsultasiyasına yazılın.",
        serviceName: "Cərrah qəbulu",
        fixedDate: "2026-12-20",
        durationSec: 5,
        mediaUrl: "https://raw.githubusercontent.com/ger0n/img_or_models/refs/heads/main/f1.jpg",
        mediaType: "image"
      },
      {
        id: "promo_4",
        type: "Акция",
        badge: "−30%",
        title: "30% endirimlə peşəkar diş təmizliyi",
        description: "Xüsusi qiymətlə kompleks ağız boşluğu gigiyenası.",
        serviceName: "Peşəkar təmizlik (Aksiya −30%)",
        fixedDate: "",
        durationSec: 5,
        mediaUrl: "https://ger0n.github.io/img_or_models/blood02.mp4",
        mediaType: "image"
      }
    ];

    function runLocalBannerTest() {
      const tpl = document.getElementById("promo-banner-template");
      if (!tpl) return;

      Swal.fire({
        width: "460px",
        padding: "20px",
        background: "#ffffff",
        html: tpl.innerHTML,
        showConfirmButton: false,
        showCloseButton: true,
        didOpen: () => {
          const root = document.getElementById("pm-root");
          const badgeEl = document.getElementById("pm-badge");
          const storyCard = document.getElementById("pm-story-card");
          const barsWrap = document.getElementById("pm-progress-bars");
          const slideTitle = document.getElementById("pm-slide-title");
          const slideDesc = document.getElementById("pm-slide-desc");
          const offerSelect = document.getElementById("pm-select-offer");
          const dateInput = document.getElementById("pm-input-date");
          const timeSelect = document.getElementById("pm-select-time");
          const submitBtn = document.getElementById("pm-submit-btn");

          // Тексты интерфейса (на примере az)
          document.getElementById("pm-hero-title").textContent = "Uğurlu!";
          document.getElementById("pm-hero-sub").textContent = "Qeydiyyat uğurla yaradıldı!";
          document.getElementById("pm-static-slogan").textContent = "Xüsusi təklifimizdən yararlanın";
          document.getElementById("pm-lbl-offer").textContent = "Xüsusi təklif";
          document.getElementById("pm-lbl-date").textContent = "Tarix";
          document.getElementById("pm-lbl-time").textContent = "Boş vaxt";
          document.getElementById("pm-opt-time-def").textContent = "Boş vaxt seçin";
          submitBtn.textContent = "Əlavə qeydiyyatı təsdiqləyin";

          // Заполняем выпадающий список
          const defOpt = document.createElement("option");
          defOpt.value = "";
          defOpt.textContent = "Təklifi seçin";
          offerSelect.appendChild(defOpt);

          mockPromotions.forEach((it) => {
            const opt = document.createElement("option");
            opt.value = it.id;
            opt.textContent = it.serviceName;
            opt.dataset.fixedDate = it.fixedDate || "";
            offerSelect.appendChild(opt);
          });

          // Зелёные полоски прогресса
          const barFills = [];
          mockPromotions.forEach(() => {
            const track = document.createElement("div");
            track.className = "pm-bar-track";
            const fill = document.createElement("div");
            fill.className = "pm-bar-fill";
            track.appendChild(fill);
            barsWrap.appendChild(track);
            barFills.push(fill);
          });

          let currentIndex = 0;
          let rafId = null;
          let startTime = 0;
          let elapsedBeforePause = 0;
          let isPaused = false;

          function renderSlide(idx) {
            currentIndex = idx;
            const item = mockPromotions[idx];

            if (item.badge) {
              badgeEl.textContent = item.badge;
              badgeEl.classList.remove("is-hidden");
            } else {
              badgeEl.classList.add("is-hidden");
            }

            storyCard.innerHTML = `<img src="${item.mediaUrl}" class="pm-story-media">`;
            slideTitle.textContent = item.title;
            slideDesc.textContent = item.description;

            barFills.forEach((fill, i) => {
              fill.style.width = i < idx ? "100%" : "0%";
            });

            elapsedBeforePause = 0;
            startTime = performance.now();
            cancelAnimationFrame(rafId);
            runProgress(item.durationSec * 1000);
          }

          function runProgress(durationMs) {
            function tick(now) {
              if (!isPaused) {
                const elapsed = elapsedBeforePause + (now - startTime);
                const pct = Math.min(100, (elapsed / durationMs) * 100);
                barFills[currentIndex].style.width = pct + "%";
                if (pct >= 100) {
                  renderSlide((currentIndex + 1) % mockPromotions.length);
                  return;
                }
              }
              rafId = requestAnimationFrame(tick);
            }
            rafId = requestAnimationFrame(tick);
          }

          // Жесты (тап влево/вправо, удержание = пауза, свайп)
          let touchStartX = 0;
          storyCard.addEventListener("pointerdown", (e) => {
            touchStartX = e.clientX;
            isPaused = true;
            elapsedBeforePause += performance.now() - startTime;
          });

          storyCard.addEventListener("pointerup", (e) => {
            isPaused = false;
            startTime = performance.now();
            const diffX = e.clientX - touchStartX;
            if (Math.abs(diffX) > 35) {
              renderSlide(diffX < 0 ? (currentIndex + 1) % mockPromotions.length : (currentIndex - 1 + mockPromotions.length) % mockPromotions.length);
            } else if (Math.abs(diffX) < 8) {
              const rect = storyCard.getBoundingClientRect();
              if (e.clientX - rect.left < rect.width * 0.3) {
                renderSlide((currentIndex - 1 + mockPromotions.length) % mockPromotions.length);
              } else {
                const cur = mockPromotions[currentIndex];
                if (cur.serviceName) {
                  offerSelect.value = cur.id;
                  offerSelect.dispatchEvent(new Event("change"));
                }
                renderSlide((currentIndex + 1) % mockPromotions.length);
              }
            }
          });

          offerSelect.addEventListener("change", () => {
            isPaused = true;
            const opt = offerSelect.options[offerSelect.selectedIndex];
            if (opt?.dataset?.fixedDate) dateInput.value = opt.dataset.fixedDate;
            validateForm();
          });

          dateInput.addEventListener("change", () => { isPaused = true; validateForm(); });
          timeSelect.addEventListener("change", () => { isPaused = true; validateForm(); });

          function validateForm() {
            const ready = Boolean(offerSelect.value && dateInput.value && timeSelect.value);
            submitBtn.disabled = !ready;
            submitBtn.classList.toggle("is-active", ready);
          }

          submitBtn.addEventListener("click", () => {
            cancelAnimationFrame(rafId);
            Swal.getPopup()?.classList.remove("pm-show-close"); // Прячем крестик на финале
            document.querySelector(".pm-hero-status").style.display = "none";
            document.getElementById("pm-body").style.display = "none";
            const finalScreen = document.getElementById("pm-final-screen");
            document.getElementById("pm-final-title").textContent = "Uğurlu!";
            document.getElementById("pm-final-sub").textContent = "Əlavə qeydiyyat uğurla yaradıldı!";
            finalScreen.style.display = "flex";
            document.getElementById("pm-final-ok-btn").addEventListener("click", () => Swal.close());
          });

          // Пауза 1.1 сек на Экране 1 -> плавный переход в Экран 2
          setTimeout(() => {
  root.classList.add("is-expanded");
  Swal.getPopup()?.classList.add("pm-show-close"); // Показываем крестик
  renderSlide(0);
}, 1800);
        }
      });
    }

    window.addEventListener("DOMContentLoaded", runLocalBannerTest);
  


  </script>
</body>
</html>
